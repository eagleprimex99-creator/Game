<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gravity Glider Prototype</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #2c3e50; 
            font-family: sans-serif;
        }
        canvas { 
            background-color: #ecf0f1; 
            border: 4px solid #bdc3c7; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Player physics and properties
        const player = { 
            x: 50, 
            y: 300, 
            width: 30, 
            height: 30, 
            dy: 0, 
            gravity: 0.6, 
            jumpPower: -12, 
            grounded: false 
        };

        // Game state variables
        let obstacles = [];
        let frame = 0;
        let score = 0;
        let gameOver = false;
        let gameSpeed = 5;

        // Listen for the Spacebar to jump
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                if (player.grounded) {
                    player.dy = player.jumpPower;
                    player.grounded = false;
                } else if (gameOver) {
                    resetGame();
                }
            }
        });

        function resetGame() {
            player.y = 300;
            player.dy = 0;
            obstacles = [];
            score = 0;
            frame = 0;
            gameSpeed = 5;
            gameOver = false;
            loop();
        }

        function update() {
            if (gameOver) return;

            // Apply gravity to player
            player.dy += player.gravity;
            player.y += player.dy;

            // Floor collision
            if (player.y + player.height > canvas.height - 20) {
                player.y = canvas.height - 20 - player.height;
                player.dy = 0;
                player.grounded = true;
            }

            // Spawn new obstacles dynamically
            if (frame % Math.max(40, 90 - Math.floor(score / 50)) === 0) {
                obstacles.push({ 
                    x: canvas.width, 
                    y: canvas.height - 60, 
                    width: 30, 
                    height: 40 
                });
            }

            // Move obstacles and check for collisions
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Hitbox collision logic
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    gameOver = true;
                }
            }

            // Clear old obstacles and increase score/speed
            if (obstacles.length > 0 && obstacles[0].x + obstacles[0].width < 0) {
                obstacles.shift();
                score += 10;
                if (score % 50 === 0) gameSpeed += 0.5; // Slowly increase difficulty
            }

            frame++;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the floor
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Draw the player (Red square)
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw obstacles (Dark squares)
            ctx.fillStyle = "#34495e";
            obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));

            // Draw UI text
            ctx.fillStyle = "#2c3e50";
            if (gameOver) {
                ctx.font = "bold 30px Arial";
                ctx.fillText("Game Over!", 310, 180);
                ctx.font = "20px Arial";
                ctx.fillText("Press Space to Restart", 295, 220);
            } else {
                ctx.font = "bold 20px Arial";
                ctx.fillText("Score: " + score, 20, 30);
            }
        }

        // Main game loop
        function loop() {
            update();
            draw();
            if (!gameOver) requestAnimationFrame(loop);
        }

        // Start the game
        loop();
    </script>
</body>
</html>
